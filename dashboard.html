  <style>
    * { font-family: 'DM Sans', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }

    .card-glow {
      position: relative;
      overflow: hidden;
    }
    .card-glow::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 60%);
      pointer-events: none;
    }

    .stat-card {
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    }

    .chart-line {
      fill: none;
      stroke: #6366f1;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    
    .chart-dot {
      fill: #6366f1;
      transition: r 0.2s ease;
      cursor: pointer;
    }
    .chart-dot:hover {
      r: 5;
    }
    
    .chart-area-fill {
      fill: url(#lineGradient);
      opacity: 0.1;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in {
      animation: fadeUp 0.5s ease forwards;
      opacity: 0;
    }
    .delay-1 { animation-delay: 0.08s; }
    .delay-2 { animation-delay: 0.16s; }
    .delay-3 { animation-delay: 0.24s; }
    .delay-4 { animation-delay: 0.4s; }

    .trend-up { color: #34d399; }
    .trend-down { color: #f87171; }

    .tooltip-container { position: relative; }
    .tooltip-container .tooltip-box {
      display: none;
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      white-space: nowrap;
      z-index: 50;
      pointer-events: none;
    }
    .tooltip-container:hover .tooltip-box {
      display: block;
    }
  </style>

  <script>
    // Sample data for 1 year (365 days)
    const data1y = [
      650, 720, 580, 810, 760, 900, 850, 680, 750, 920,
      1050, 880, 790, 950, 1100, 870, 830, 960, 1020, 780,
      850, 910, 1080, 990, 870, 940, 1150, 1050, 980, 1100,
      920, 1020, 1180, 850, 960, 1090, 1030, 880, 950, 1120,
      780, 1050, 1200, 920, 1080, 1150, 890, 1010, 1160, 1040,
      900, 1070, 1220, 950, 1100, 1180, 920, 1030, 1190, 1080,
      950, 1090, 1240, 980, 1120, 1200, 950, 1050, 1210, 1100,
      970, 1110, 1260, 1000, 1140, 1220, 970, 1070, 1230, 1120,
      990, 1130, 1280, 1020, 1160, 1240, 990, 1090, 1250, 1140,
      1010, 1150, 1300, 1040, 1180, 1260, 1010, 1110, 1270, 1160,
      1030, 1170, 1320, 1060, 1200, 1280, 1030, 1130, 1290, 1180,
      1050, 1190, 1340, 1080, 1220, 1300, 1050, 1150, 1310, 1200,
      1070, 1210, 1360, 1100, 1240, 1320, 1070, 1170, 1330, 1220,
      1090, 1230, 1380, 1120, 1260, 1340, 1090, 1190, 1350, 1240,
      1110, 1250, 1400, 1140, 1280, 1360, 1110, 1210, 1370, 1260,
      1130, 1270, 1420, 1160, 1300, 1380, 1130, 1230, 1390, 1280,
      1150, 1290, 1440, 1180, 1320, 1400, 1150, 1250, 1410, 1300,
      1170, 1310, 1460, 1200, 1340, 1420, 1170, 1270, 1430, 1320,
      1190, 1330, 1480, 1220, 1360, 1440, 1190, 1290, 1450, 1340,
      1210, 1350, 1500, 1240, 1380, 1460, 1210, 1310, 1470, 1360,
      1230, 1370, 1520, 1260, 1400, 1480, 1230, 1330, 1490, 1380,
      1250, 1390, 1540, 1280, 1420, 1500, 1250, 1350, 1510, 1400,
      1270, 1410, 1560, 1300, 1440, 1520, 1270, 1370, 1530, 1420,
      1290, 1430, 1580, 1320, 1460, 1540, 1290, 1390, 1550, 1440,
      1310, 1450, 1600, 1340, 1480, 1560, 1310, 1410, 1570, 1460,
      1330, 1470, 1620, 1360, 1500, 1580, 1330, 1430, 1590, 1480,
      1350, 1490, 1640, 1380, 1520, 1600, 1350, 1450, 1610, 1500
    ];

    function generateLabels(count, range) {
      const labels = [];
      const now = new Date();
      
      if (range === '12m') {
        for (let i = count - 1; i >= 0; i--) {
          const d = new Date(now);
          d.setDate(d.getDate() - i);
          if (i % 30 === 0 || i === 0) {
            labels.push(d.toLocaleDateString('en-US', { month: 'short' }));
          } else {
            labels.push('');
          }
        }
      } else if (range === '6m') {
        for (let i = count - 1; i >= 0; i--) {
          const d = new Date(now);
          d.setDate(d.getDate() - i);
          if (i % 15 === 0 || i === 0) {
            labels.push(d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
          } else {
            labels.push('');
          }
        }
      } else {
        for (let i = count - 1; i >= 0; i--) {
          const d = new Date(now);
          d.setDate(d.getDate() - i);
          labels.push(d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
        }
      }
      return labels;
    }

    let currentRange = '30d';

    function setRange(range) {
      currentRange = range;
      document.querySelectorAll('.range-btn').forEach(btn => {
        btn.style.backgroundColor = 'transparent';
        btn.style.color = '#6b7084';
      });
      document.getElementById('btn-' + range).style.backgroundColor = '#6366f1';
      document.getElementById('btn-' + range).style.color = '#e2e4ec';
      renderChart();
    }

    function renderChart() {
      const sliceMap = { '30d': 30, '6m': 180, '12m': 365 };
      const count = sliceMap[currentRange];
      const data = data1y.slice(-count);
      const labels = generateLabels(count, currentRange);
      const maxVal = 1600;
      const minVal = 0;

      const chartContainer = document.getElementById('chart-bars');
      const labelsContainer = document.getElementById('chart-labels');
      chartContainer.innerHTML = '';
      labelsContainer.innerHTML = '';

      // Create SVG for line chart
      const svgNS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', `0 0 ${(count - 1) * 40 + 40} 220`);
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.style.width = '100%';
      svg.style.height = '220px';

      // Define gradient for area fill
      const defs = document.createElementNS(svgNS, 'defs');
      const gradient = document.createElementNS(svgNS, 'linearGradient');
      gradient.setAttribute('id', 'lineGradient');
      gradient.setAttribute('x1', '0%');
      gradient.setAttribute('y1', '0%');
      gradient.setAttribute('x2', '0%');
      gradient.setAttribute('y2', '100%');
      
      const stop1 = document.createElementNS(svgNS, 'stop');
      stop1.setAttribute('offset', '0%');
      stop1.setAttribute('stop-color', '#6366f1');
      stop1.setAttribute('stop-opacity', '0.3');
      
      const stop2 = document.createElementNS(svgNS, 'stop');
      stop2.setAttribute('offset', '100%');
      stop2.setAttribute('stop-color', '#6366f1');
      stop2.setAttribute('stop-opacity', '0');
      
      gradient.appendChild(stop1);
      gradient.appendChild(stop2);
      defs.appendChild(gradient);
      svg.appendChild(defs);

      // Create path for line
      let pathData = '';
      let areaPathData = 'M ';
      
      data.forEach((val, i) => {
        const x = i * 40 + 20;
        const y = 220 - (val / maxVal) * 220;
        
        if (i === 0) {
          pathData = `M ${x} ${y}`;
          areaPathData += `${x} ${y} `;
        } else {
          pathData += ` L ${x} ${y}`;
          areaPathData += `L ${x} ${y} `;
        }
      });

      // Add area path closure
      areaPathData += `L ${(count - 1) * 40 + 20} 220 L 20 220 Z`;

      // Create area fill
      const area = document.createElementNS(svgNS, 'path');
      area.setAttribute('d', areaPathData);
      area.setAttribute('fill', 'url(#lineGradient)');
      svg.appendChild(area);

      // Create line
      const line = document.createElementNS(svgNS, 'path');
      line.setAttribute('d', pathData);
      line.setAttribute('class', 'chart-line');
      line.style.opacity = '0';
      svg.appendChild(line);

      // Animate line in
      setTimeout(() => {
        line.style.opacity = '1';
        line.style.transition = 'opacity 0.8s ease';
      }, 50);

      // Create dots with tooltips
      data.forEach((val, i) => {
        const x = i * 40 + 20;
        const y = 220 - (val / maxVal) * 220;

        const g = document.createElementNS(svgNS, 'g');
        g.className = 'tooltip-container';
        
        // Invisible larger hitbox
        const hitbox = document.createElementNS(svgNS, 'circle');
        hitbox.setAttribute('cx', x);
        hitbox.setAttribute('cy', y);
        hitbox.setAttribute('r', '8');
        hitbox.setAttribute('fill', 'transparent');
        hitbox.style.cursor = 'pointer';
        
        // Visible dot
        const dot = document.createElementNS(svgNS, 'circle');
        dot.setAttribute('cx', x);
        dot.setAttribute('cy', y);
        dot.setAttribute('r', '3.5');
        dot.setAttribute('class', 'chart-dot');

        // Tooltip
        const tooltip = document.createElement('div');
        tooltip.className = 'tooltip-box';
        tooltip.style.backgroundColor = '#2a2d3a';
        tooltip.style.color = '#e2e4ec';
        tooltip.innerHTML = `<span class="mono font-medium">${val.toLocaleString()}</span><br><span style="color:#6b7084;font-size:10px;">${labels[i]}</span>`;
        
        g.appendChild(hitbox);
        g.appendChild(dot);
        g.appendChild(tooltip);
        svg.appendChild(g);
      });

      chartContainer.appendChild(svg);

      // X-axis labels
      const labelCount = Math.min(6, count);
      const step = Math.floor(count / labelCount);
      for (let i = 0; i < count; i++) {
        const lbl = document.createElement('span');
        lbl.className = 'text-xs';
        lbl.style.color = '#6b7084';
        lbl.style.flex = '1';
        lbl.style.textAlign = 'center';
        lbl.style.fontSize = '10px';
        if (i % step === 0 || i === count - 1) {
          lbl.textContent = labels[i];
        }
        labelsContainer.appendChild(lbl);
      }
    }

    // Element SDK
    const defaultConfig = {
      dashboard_title: 'My Website Dashboard',
      website_name: 'mysite.com',
      background_color: '#ffffff',
      surface_color: '#0f1117',
      text_color: '#e2e4ec',
      accent_color: '#6366f1',
      muted_color: '#6b7084',
      font_family: 'DM Sans',
      font_size: 16
    };

    function applyConfig(config) {
      const c = { ...defaultConfig, ...config };

      document.getElementById('dashboard-title').textContent = c.dashboard_title;
      document.getElementById('website-name').textContent = c.website_name;

      // Background
      document.getElementById('app-wrapper').style.backgroundColor = c.background_color;

      // Surfaces
      document.querySelectorAll('.stat-card, section.card-glow').forEach(el => {
        el.style.backgroundColor = c.surface_color;
        el.style.borderColor = c.surface_color;
      });

      // Text color
      document.querySelectorAll('.mono.text-3xl, h1, h2').forEach(el => {
        el.style.color = c.text_color;
