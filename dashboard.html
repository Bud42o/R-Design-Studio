<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
  <style>
    * { font-family: 'DM Sans', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }

    .card-glow {
      position: relative;
      overflow: hidden;
    }
    .card-glow::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 60%);
      pointer-events: none;
    }

    .stat-card {
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    }

    .chart-line {
      fill: none;
      stroke: #6366f1;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    
    .chart-dot {
      fill: #6366f1;
      transition: r 0.2s ease;
      cursor: pointer;
    }
    .chart-dot:hover {
      r: 5;
    }
    
    .chart-area-fill {
      fill: url(#lineGradient);
      opacity: 0.1;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in {
      animation: fadeUp 0.5s ease forwards;
      opacity: 0;
    }
    .delay-1 { animation-delay: 0.08s; }
    .delay-2 { animation-delay: 0.16s; }
    .delay-3 { animation-delay: 0.24s; }
    .delay-4 { animation-delay: 0.4s; }

    .trend-up { color: #34d399; }
    .trend-down { color: #f87171; }

    .tooltip-container { position: relative; }
    .tooltip-container .tooltip-box {
      display: none;
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      white-space: nowrap;
      z-index: 50;
      pointer-events: none;
    }
    .tooltip-container:hover .tooltip-box {
      display: block;
    }
  </style>
  <style>
    body { box-sizing: border-box; }

    .logout-btn {
      border: 1px solid #343a4a;
      background: #1a1c27;
      color: #e2e4ec;
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 600;
      transition: 120ms ease;
    }

    .logout-btn:hover {
      background: #262938;
    }

    .error-banner {
      display: none;
      margin-top: 12px;
      margin-left: 3rem;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: #fda4af;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
    }
  </style>
 </head>
 <body class="h-full">
  <div id="app-wrapper" class="h-full w-full overflow-auto" style="background-color: #ffffff;">
   <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8"><!-- Header -->
    <header class="mb-8 animate-in">
     <div class="flex items-center justify-between gap-3 mb-1 flex-wrap">
      <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg flex items-center justify-center" style="background-color: #6366f1;"><i data-lucide="bar-chart-3" style="width:18px;height:18px;color:#0f1117;"></i>
      </div>
      <h1 id="dashboard-title" class="text-2xl font-bold" style="color: #2f3038;">R Design Studio</h1>
      </div>
      <button id="logout-btn" class="logout-btn" type="button">Sign out</button>
     </div>
     <p id="website-name" class="ml-12 text-sm" style="color: #6b7084;">Signed in as <span id="user-email" class="mono">...</span></p>
     <p id="dash-error" class="error-banner"></p>
    </header><!-- Main Dashboard Container -->
    <section class="card-glow rounded-xl p-10 animate-in delay-1" style="background-color: #0f1117; border: 1px solid #2a2d3a;"><!-- Visitors Title -->
     <h2 class="text-lg font-semibold mb-4" style="color: #e2e4ec;">Visitors</h2><!-- Stat Cards -->
     <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8"><!-- 30 Days -->
      <div class="stat-card card-glow rounded-xl p-5 animate-in delay-1" style="background-color: #252a38; border: 1px solid #343a4a;">
       <div class="flex items-center justify-between mb-4"><span class="text-xs font-medium uppercase tracking-wider" style="color: #6b7084;">Last 30 Days</span>
        <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background-color: rgba(99,102,241,0.12);"><i data-lucide="calendar" style="width:15px;height:15px;color:#6366f1;"></i>
        </div>
       </div>
      <div id="stat-30" class="mono text-3xl font-bold mb-2" style="color: #e2e4ec;">
       -
       </div>
      <div class="flex items-center gap-1.5"><i id="icon-30" data-lucide="trending-up" class="trend-up" style="width:14px;height:14px;"></i> <span id="trend-30" class="text-xs font-medium trend-up">-</span> <span class="text-xs" style="color: #6b7084;">vs prev. period</span>
       </div><!-- Mini sparkline -->
       <div class="flex items-end gap-0.5 mt-4 h-8">
        <div class="flex-1 rounded-sm" style="height:40%;background-color:rgba(99,102,241,0.25);"></div>
        <div class="flex-1 rounded-sm" style="height:55%;background-color:rgba(99,102,241,0.3);"></div>
        <div class="flex-1 rounded-sm" style="height:35%;background-color:rgba(99,102,241,0.25);"></div>
        <div class="flex-1 rounded-sm" style="height:65%;background-color:rgba(99,102,241,0.35);"></div>
        <div class="flex-1 rounded-sm" style="height:50%;background-color:rgba(99,102,241,0.3);"></div>
        <div class="flex-1 rounded-sm" style="height:70%;background-color:rgba(99,102,241,0.4);"></div>
        <div class="flex-1 rounded-sm" style="height:85%;background-color:rgba(99,102,241,0.5);"></div>
        <div class="flex-1 rounded-sm" style="height:75%;background-color:rgba(99,102,241,0.45);"></div>
        <div class="flex-1 rounded-sm" style="height:90%;background-color:rgba(99,102,241,0.55);"></div>
        <div class="flex-1 rounded-sm" style="height:100%;background-color:#6366f1;"></div>
       </div>
      </div><!-- 7 Days -->
      <div class="stat-card card-glow rounded-xl p-5 animate-in delay-2" style="background-color: #252a38; border: 1px solid #343a4a;">
       <div class="flex items-center justify-between mb-4"><span class="text-xs font-medium uppercase tracking-wider" style="color: #6b7084;">Last 7 Days</span>
        <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background-color: rgba(52,211,153,0.12);"><i data-lucide="activity" style="width:15px;height:15px;color:#34d399;"></i>
        </div>
       </div>
      <div id="stat-7" class="mono text-3xl font-bold mb-2" style="color: #e2e4ec;">
       -
       </div>
      <div class="flex items-center gap-1.5"><i id="icon-7" data-lucide="trending-up" class="trend-up" style="width:14px;height:14px;"></i> <span id="trend-7" class="text-xs font-medium trend-up">-</span> <span class="text-xs" style="color: #6b7084;">vs prev. week</span>
       </div>
       <div class="flex items-end gap-0.5 mt-4 h-8">
        <div class="flex-1 rounded-sm" style="height:60%;background-color:rgba(52,211,153,0.25);"></div>
        <div class="flex-1 rounded-sm" style="height:45%;background-color:rgba(52,211,153,0.2);"></div>
        <div class="flex-1 rounded-sm" style="height:75%;background-color:rgba(52,211,153,0.35);"></div>
        <div class="flex-1 rounded-sm" style="height:55%;background-color:rgba(52,211,153,0.25);"></div>
        <div class="flex-1 rounded-sm" style="height:80%;background-color:rgba(52,211,153,0.4);"></div>
        <div class="flex-1 rounded-sm" style="height:65%;background-color:rgba(52,211,153,0.3);"></div>
        <div class="flex-1 rounded-sm" style="height:100%;background-color:#34d399;"></div>
       </div>
      </div><!-- Today -->
      <div class="stat-card card-glow rounded-xl p-5 animate-in delay-3" style="background-color: #252a38; border: 1px solid #343a4a;">
       <div class="flex items-center justify-between mb-4"><span class="text-xs font-medium uppercase tracking-wider" style="color: #6b7084;">Today</span>
        <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background-color: rgba(251,191,36,0.12);"><i data-lucide="zap" style="width:15px;height:15px;color:#fbbf24;"></i>
        </div>
       </div>
      <div id="stat-today" class="mono text-3xl font-bold mb-2" style="color: #e2e4ec;">
       -
       </div>
      <div class="flex items-center gap-1.5"><i id="icon-today" data-lucide="trending-up" class="trend-up" style="width:14px;height:14px;"></i> <span id="trend-today" class="text-xs font-medium trend-up">-</span> <span class="text-xs" style="color: #6b7084;">vs yesterday</span>
       </div>
       <div class="flex items-end gap-0.5 mt-4 h-8">
        <div class="flex-1 rounded-sm" style="height:30%;background-color:rgba(251,191,36,0.15);"></div>
        <div class="flex-1 rounded-sm" style="height:50%;background-color:rgba(251,191,36,0.2);"></div>
        <div class="flex-1 rounded-sm" style="height:80%;background-color:rgba(251,191,36,0.35);"></div>
        <div class="flex-1 rounded-sm" style="height:100%;background-color:rgba(251,191,36,0.5);"></div>
        <div class="flex-1 rounded-sm" style="height:70%;background-color:rgba(251,191,36,0.3);"></div>
        <div class="flex-1 rounded-sm" style="height:45%;background-color:rgba(251,191,36,0.2);"></div>
        <div class="flex-1 rounded-sm" style="height:20%;background-color:rgba(251,191,36,0.12);"></div>
       </div>
      </div>
     </div><!-- Historical Chart -->
     <div class="border-t" style="border-color: #2a2d3a; padding-top: 1.5rem;">
      <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
       <div>
        <h2 class="text-lg font-semibold" style="color: #e2e4ec;">History</h2>
        <p class="text-xs mt-0.5" style="color: #6b7084;">Total website visits over time</p>
       </div>
       <div class="flex gap-1.5 rounded-lg p-1 flex-wrap" style="background-color: #1a1c27;"><button id="btn-12m" onclick="setRange('12m')" class="range-btn px-3 py-1.5 rounded-md text-xs font-medium transition-colors" style="background-color:transparent;color:#6b7084;">12 Months</button> <button id="btn-6m" onclick="setRange('6m')" class="range-btn px-3 py-1.5 rounded-md text-xs font-medium transition-colors" style="background-color:transparent;color:#6b7084;">6 Months</button> <button id="btn-30d" onclick="setRange('30d')" class="range-btn px-3 py-1.5 rounded-md text-xs font-medium transition-colors" style="background-color:#6366f1;color:#e2e4ec;">30 Days</button>
       </div>
      </div><!-- Y-axis + bars -->
      <div class="flex gap-3"><!-- Y-axis labels -->
      <div id="y-axis" class="flex flex-col justify-between text-right pr-1 mono" style="height: 220px;"><span class="text-xs" style="color:#6b7084;">1.2k</span> <span class="text-xs" style="color:#6b7084;">900</span> <span class="text-xs" style="color:#6b7084;">600</span> <span class="text-xs" style="color:#6b7084;">300</span> <span class="text-xs" style="color:#6b7084;">0</span>
       </div><!-- Chart area -->
       <div class="flex-1 relative"><!-- Grid lines -->
        <div class="absolute inset-0 flex flex-col justify-between pointer-events-none" style="height: 220px;">
         <div style="border-top:1px dashed #2a2d3a;"></div>
         <div style="border-top:1px dashed #2a2d3a;"></div>
         <div style="border-top:1px dashed #2a2d3a;"></div>
         <div style="border-top:1px dashed #2a2d3a;"></div>
         <div style="border-top:1px solid #2a2d3a;"></div>
        </div><!-- Bars -->
        <div id="chart-bars" class="flex items-end gap-1 relative" style="height: 220px;"><!-- Bars injected by JS -->
        </div><!-- X-axis labels -->
        <div id="chart-labels" class="flex justify-between mt-2 mono"><!-- Labels injected by JS -->
        </div>
       </div>
      </div>
     </div>
    </section>
   </div>
  </div>
  <script>
    let data1y = [];
    let currentRange = '30d';

    function formatNumber(value) {
      return Number(value || 0).toLocaleString('en-US');
    }

    function formatTrend(value) {
      const sign = value > 0 ? '+' : '';
      return `${sign}${value.toFixed(1)}%`;
    }

    function setTrend(targetId, iconId, value) {
      const text = document.getElementById(targetId);
      const icon = document.getElementById(iconId);
      const up = value >= 0;

      text.textContent = formatTrend(value);
      text.className = `text-xs font-medium ${up ? 'trend-up' : 'trend-down'}`;
      icon.setAttribute('data-lucide', up ? 'trending-up' : 'trending-down');
      icon.className = up ? 'trend-up' : 'trend-down';
    }

    function parseDateValue(raw) {
      const year = Number(raw.slice(0, 4));
      const month = Number(raw.slice(4, 6)) - 1;
      const day = Number(raw.slice(6, 8));
      return new Date(year, month, day);
    }

    function generateLabels(count, range) {
      const labels = [];
      const slice = data1y.slice(-count);

      for (let i = 0; i < slice.length; i += 1) {
        const d = parseDateValue(slice[i].date);
        if (range === '12m') {
          labels.push(i % 30 === 0 || i === slice.length - 1 ? d.toLocaleDateString('en-US', { month: 'short' }) : '');
        } else if (range === '6m') {
          labels.push(i % 15 === 0 || i === slice.length - 1 ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '');
        } else {
          labels.push(d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
        }
      }

      return labels;
    }

    function renderYAxis(maxVal) {
      const axis = document.getElementById('y-axis');
      axis.innerHTML = '';
      const ticks = 4;

      for (let i = ticks; i >= 0; i -= 1) {
        const value = Math.round((maxVal / ticks) * i);
        const label = document.createElement('span');
        label.className = 'text-xs';
        label.style.color = '#6b7084';
        label.textContent = value >= 1000 ? `${(value / 1000).toFixed(1)}k` : String(value);
        axis.appendChild(label);
      }
    }

    function setRange(range) {
      currentRange = range;
      document.querySelectorAll('.range-btn').forEach((btn) => {
        btn.style.backgroundColor = 'transparent';
        btn.style.color = '#6b7084';
      });
      document.getElementById('btn-' + range).style.backgroundColor = '#6366f1';
      document.getElementById('btn-' + range).style.color = '#e2e4ec';
      renderChart();
    }

    function renderChart() {
      const sliceMap = { '30d': 30, '6m': 180, '12m': 365 };
      const count = sliceMap[currentRange];
      const points = data1y.slice(-count);
      const labels = generateLabels(count, currentRange);

      const values = points.map((entry) => entry.value);
      const maxVal = Math.max(...values, 10);

      renderYAxis(maxVal);

      const chartContainer = document.getElementById('chart-bars');
      const labelsContainer = document.getElementById('chart-labels');
      chartContainer.innerHTML = '';
      labelsContainer.innerHTML = '';

      const svgNS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', `0 0 ${(count - 1) * 40 + 40} 220`);
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.style.width = '100%';
      svg.style.height = '220px';

      const defs = document.createElementNS(svgNS, 'defs');
      const gradient = document.createElementNS(svgNS, 'linearGradient');
      gradient.setAttribute('id', 'lineGradient');
      gradient.setAttribute('x1', '0%');
      gradient.setAttribute('y1', '0%');
      gradient.setAttribute('x2', '0%');
      gradient.setAttribute('y2', '100%');

      const stop1 = document.createElementNS(svgNS, 'stop');
      stop1.setAttribute('offset', '0%');
      stop1.setAttribute('stop-color', '#6366f1');
      stop1.setAttribute('stop-opacity', '0.3');

      const stop2 = document.createElementNS(svgNS, 'stop');
      stop2.setAttribute('offset', '100%');
      stop2.setAttribute('stop-color', '#6366f1');
      stop2.setAttribute('stop-opacity', '0');

      gradient.appendChild(stop1);
      gradient.appendChild(stop2);
      defs.appendChild(gradient);
      svg.appendChild(defs);

      let pathData = '';
      let areaPathData = 'M ';
      values.forEach((val, i) => {
        const x = i * 40 + 20;
        const y = 220 - (val / maxVal) * 220;
        if (i === 0) {
          pathData = `M ${x} ${y}`;
          areaPathData += `${x} ${y} `;
        } else {
          pathData += ` L ${x} ${y}`;
          areaPathData += `L ${x} ${y} `;
        }
      });

      areaPathData += `L ${(count - 1) * 40 + 20} 220 L 20 220 Z`;

      const area = document.createElementNS(svgNS, 'path');
      area.setAttribute('d', areaPathData);
      area.setAttribute('fill', 'url(#lineGradient)');
      svg.appendChild(area);

      const line = document.createElementNS(svgNS, 'path');
      line.setAttribute('d', pathData);
      line.setAttribute('class', 'chart-line');
      svg.appendChild(line);

      chartContainer.appendChild(svg);

      const labelCount = Math.min(6, count);
      const step = Math.max(1, Math.floor(count / labelCount));
      for (let i = 0; i < count; i += 1) {
        const label = document.createElement('span');
        label.className = 'text-xs';
        label.style.color = '#6b7084';
        label.style.flex = '1';
        label.style.textAlign = 'center';
        label.style.fontSize = '10px';
        if (i % step === 0 || i === count - 1) {
          label.textContent = labels[i];
        }
        labelsContainer.appendChild(label);
      }
    }

    function showError(message) {
      const box = document.getElementById('dash-error');
      box.style.display = 'block';
      box.textContent = message;
    }

    async function logout() {
      await fetch('/api/session-logout', {
        method: 'POST',
        credentials: 'same-origin',
      });
      window.location.href = '/login.html';
    }

    async function initDashboard() {
      const meRes = await fetch('/api/session-me', {
        method: 'GET',
        credentials: 'same-origin',
        cache: 'no-store',
      });

      if (!meRes.ok) {
        window.location.href = '/login.html';
        return;
      }

      const mePayload = await meRes.json();
      document.getElementById('user-email').textContent = mePayload.user.email;

      const metricsRes = await fetch('/api/dashboard-metrics', {
        method: 'GET',
        credentials: 'same-origin',
        cache: 'no-store',
      });

      if (!metricsRes.ok) {
        const payload = await metricsRes.json().catch(() => ({}));
        throw new Error(payload.error || 'Failed to load analytics data.');
      }

      const payload = await metricsRes.json();
      data1y = payload.series || [];

      if (!data1y.length) {
        throw new Error('No analytics data available for this property yet.');
      }

      document.getElementById('stat-30').textContent = formatNumber(payload.totals.days30);
      document.getElementById('stat-7').textContent = formatNumber(payload.totals.days7);
      document.getElementById('stat-today').textContent = formatNumber(payload.totals.today);

      setTrend('trend-30', 'icon-30', Number(payload.totals.change30 || 0));
      setTrend('trend-7', 'icon-7', Number(payload.totals.change7 || 0));
      setTrend('trend-today', 'icon-today', Number(payload.totals.changeToday || 0));

      renderChart();
      lucide.createIcons();
    }

    document.getElementById('logout-btn').addEventListener('click', logout);

    initDashboard().catch((error) => {
      showError(error.message || 'Dashboard failed to load.');
    });
  </script>
</body>
</html>
